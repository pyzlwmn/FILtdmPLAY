# ============ Gradle ============
# 本机只有 2G 内存：给 Gradle 3G 堆会把 decompile 子进程挤成 OOM 杀掉，降到 1G
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# NeoForm 反编译（forgeflower）单独限堆，否则默认拿 JVM 最大值又撞 OOM
neoForgeRuntime.jvmArgs=-Xmx1200m

# ============ Minecraft / Forge / mappings ============
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47.4.10,)
loader_version_range=[47,)
mapping_mc_version=1.20.1
mapping_version=2023.09.03

# ============ FPSMatch 相关 ============
fpsm_version_range=[1.3.0,)
ldlib2_version_range=[2.2.27+1.20.1]
modernui_core_version=3.12.0
modernui_forge_version=3.12.0.1
kotlin_forge_version=4.11.0

# ============ 构建期依赖 ============
mixinextras_version=0.5.3
mixin_processor_version=0.8.5

# ============ Mod 元数据 ============
mod_id=filtdm
mod_name=FIL Team Deathmatch
mod_license=GPL-3.0-only
