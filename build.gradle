plugins {
    id 'eclipse'
    id 'idea'
    // ★ 只留 moddev legacyforge；原来那行 net.minecraftforge.gradle 必须删掉（两个插件同时挂会打架）
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = '1.20.1-47.4.23'                 // = ${minecraft_version}-${forge_version}
    parchment {
        minecraftVersion = '1.20.1'
        mappingsVersion = '2023.09.03'
    }
    runs {
        configureEach { gameDirectory = project.file('run') }
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

// 如果你在向导里勾了 Mixins，就放开这一段（并确认 resources 下有 ${mod_id}.mixins.json）
// mixin {
//     add sourceSets.main, "${mod_id}.refmap.json"
//     config "${mod_id}.mixins.json"
// }

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    maven {
        name = 'PTCrysReleases'
        url = uri('https://maven.ptcrys.net/releases')
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'IzzelAliz'
        url = 'https://maven.izzel.io/releases/'
    }
}

dependencies {
    // ===== FPSMatch：官方写法 modImplementation（源码由 settings.gradle 的 includeBuild('FPSMatch') 提供）=====
    modImplementation('com.ptcrys:fpsmatch') { transitive = false }

    // 不拉源码、直接吃生产 jar 时，注释上一行，改用下面任一行：
    // modImplementation 'curse.maven:fpsmatch-1331710:7109977'
    // modImplementation files('libs/fpsmatch-1.20.1-1.3.0-forge-snapshot.jar')

    // ===== FPSMatch 的运行时依赖（不写的话 runClient 会报 Missing mandatory dependencies）=====
    implementation('com.lowdragmc:ldlib2-forge:2.2.27+1.20.1')
    modImplementation 'icyllis.modernui:ModernUI-Forge:1.20.1-3.12.0.1'
    modRuntimeOnly 'maven.modrinth:kotlin-for-forge:4.11.0'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version, forge_version_range: forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors            : mod_authors, mod_description: mod_description,]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    // ★ 原来这里的 finalizedBy 'reobfJar' 已删除：moddev legacyforge 自己处理重混淆，
    //   留着会报 "Task with path 'reobfJar' not found"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
